name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          commitish: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && 'main' || github.ref }}
          dry-run: ${{ github.event_name == 'pull_request' }}
